[package]
name = "plainpad"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
cosmic-text = "0.19.0"
miniz_oxide = "0.9.1"
open = "5.4.5"
rfd = "0.18.0"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
softbuffer = "0.4.8"
unicode-segmentation = "1.13.3"
winit = "0.30.13"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Wayland tab drag-and-drop, on the same libwayland connection winit uses.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
